server.port=${SERVER_PORT:8081}
spring.application.name=linkhub
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkhub}
spring.datasource.username=${DB_USER:linkhub}
spring.datasource.password=${DB_PASSWORD:linkhub_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
linkhub.base-url=${APP_BASE_URL:http://localhost:${server.port}}
spring.task.scheduling.pool.size=4
linkhub.mail.enabled=${MAIL_ENABLED:false}
linkhub.mail.from=${MAIL_FROM:no-reply@localhost}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
linkhub.mail.poll-ms=5000
linkhub.notifications.poll-ms=3000
linkhub.reminders.enabled=${BOOKING_REMINDERS_ENABLED:true}
linkhub.reminders.poll-ms=60000
linkhub.security.token-mail-key=${TOKEN_MAIL_KEY:}
linkhub.ops.token=${OPS_TOKEN:}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
logging.pattern.level=%5p [requestId=%X{requestId:-}]
