name: LinkHub checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, API, PostgreSQL concurrency and Redis tests
        run: bash mvnw -B verify -Dcontainers=true -DskipTests=false -Dmaven.test.skip=false
